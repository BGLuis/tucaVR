# Ambiente de teste de protocolos de rede para o Fase 0.1 (T6/T7,
# docs/phases/PHASE-0.1-MVP.md). Sobe um servidor real para cada protocolo
# que o Demuxer (Rust) fala (rust/protocols/src): SMB2/3, HTTP puro e HTTPS
# com TLS auto-assinado — para exercitar o codigo de producao
# (protocols::smb, protocols::http) contra servidores de verdade em vez de
# so mocks in-process. Nenhum destes servicos e exposto fora do host: as
# portas mapeadas sao so para o teste local via scripts/test-network-protocols.sh.
#
# Uso: ver scripts/test-network-protocols.sh (orquestra fixture + up + testes + down).

services:
  smb-test:
    image: dperson/samba:latest
    container_name: vrplayer-smb-test
    # Duas shares: uma guest (sem senha, exercita o caminho "anonimo" de
    # protocols::smb::SmbTarget com username vazio) e uma autenticada
    # (exercita NTLMv2 user/senha). Ver README.md deste diretorio para as
    # credenciais de teste.
    command: >
      -p
      -u "vruser;vrpass123"
      -s "guestshare;/share/guest;yes;yes;yes"
      -s "authshare;/share/auth;yes;no;no;vruser"
      -n
    volumes:
      - ./fixtures:/share/guest:ro
      - ./fixtures:/share/auth:ro
    ports:
      - "14450:445"
    tmpfs:
      - /tmp

  http-test:
    image: nginx:1.27-alpine
    container_name: vrplayer-http-test
    volumes:
      - ./fixtures:/usr/share/nginx/html:ro
      - ./http-test/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "18080:80"

  https-test:
    build: ./https-test
    container_name: vrplayer-https-test
    volumes:
      - ./fixtures:/usr/share/nginx/html:ro
      - ./https-test/certs:/etc/nginx/tls
    ports:
      - "18443:443"

  ftp-test:
    # `delfer/alpine-ftp-server` (vsftpd sobre Alpine) em vez de outras opcoes
    # populares (ex: `stilliard/pure-ftpd`): imagem minuscula, configuracao
    # inteira via env vars (sem precisar de arquivo de config custom como o
    # https-test precisa pro TLS), e o `ADDRESS`/`MIN_PORT`/`MAX_PORT`
    # cobrem exatamente o que T6.1 exige (modo passivo funcionando atraves
    # do NAT do Docker — ver "Gotcha: modo passivo" no README.md deste
    # diretorio).
    image: delfer/alpine-ftp-server
    container_name: vrplayer-ftp-test
    environment:
      # Formato `user|senha|home-dir-dentro-do-container`. `/ftp/vruser` (em
      # vez do `/home/vruser` default da imagem) evita colisao com o
      # diretorio home real do usuario `vruser` que o entrypoint da imagem
      # cria em `/home` — ver nota no volume abaixo sobre por que o mount
      # nao pode ser read-only.
      - USERS=vruser|vrpass123|/ftp/vruser
      # PASV_ADDRESS anunciado ao cliente no reply do comando PASV — tem que
      # ser um endereco que o CLIENTE consiga alcancar. Como o teste sempre
      # roda no mesmo host que o Docker (nunca de outra maquina), `127.0.0.1`
      # funciona: o Rust de teste conecta em `127.0.0.1:12121` e o
      # `docker-proxy` do Docker encaminha as portas passivas mapeadas
      # (12100-12110) de volta pro mesmo `127.0.0.1`.
      - ADDRESS=127.0.0.1
      - MIN_PORT=12100
      - MAX_PORT=12110
    volumes:
      # NAO ":ro" (achado desta sessao, corrige regressao do entrypoint da
      # imagem `delfer/alpine-ftp-server`): o entrypoint faz `adduser -h
      # /ftp/vruser` + `chown` no proprio diretorio home durante o boot do
      # container, o que falha com "Read-only file system" se o mount for
      # somente-leitura — mesmo o diretorio ja "existindo" via bind mount.
      # Container efemero de teste, sem risco real em permitir escrita.
      - ./fixtures:/ftp/vruser
    ports:
      - "12121:21"
      - "12100-12110:12100-12110"

  sftp-test:
    # `atmoz/sftp` (OpenSSH real dentro de um container minimo) — cobre T6.2
    # dos dois jeitos que a tarefa pede: senha (`command: vruser:vrpass123:...`)
    # E chave publica (mount em `.ssh/keys/`, ver `README.md` deste diretorio,
    # secao "Gotcha: chave publica do atmoz/sftp"). Mesmo usuario `vruser`
    # aceita os dois metodos simultaneamente — o servidor OpenSSH nao exige
    # exclusividade entre eles.
    image: atmoz/sftp:latest
    container_name: vrplayer-sftp-test
    # Formato `usuario:senha:uid`. UID fixo (1001) so pra ficar previsivel
    # nos logs/debug — nao ha nenhum outro significado.
    command: vruser:vrpass123:1001
    volumes:
      # Subdiretorio dentro do home, NUNCA o home em si (`/home/vruser`) —
      # ver README.md, "Gotcha: chroot exige owner root no home". O
      # entrypoint da imagem faz `chown root:root`/`chmod 755` no home a
      # cada subida, entao montar a fixture DENTRO dele (nao por cima dele)
      # e o que evita o container recusar autenticacao por "bad ownership or
      # modes for chroot directory".
      - ./fixtures:/home/vruser/fixtures:ro
      # Convencao documentada do atmoz/sftp: qualquer arquivo aqui dentro
      # vira uma linha em ~vruser/.ssh/authorized_keys na subida (script
      # `create-sftp-user` do proprio image, ver README.md).
      - ./ssh-keys/vrplayer_test_key.pub:/home/vruser/.ssh/keys/vrplayer_test_key.pub:ro
    ports:
      - "12222:22"
