# Network protocol test environment for Phase 0.1 (T6/T7,
# docs/phases/PHASE-0.1-MVP.md) and Phase 0.4 (Sections 2/3). It brings up a real server for each
# protocol the Demuxer (Rust) speaks (rust/protocols/src): SMB2/3, plain HTTP, HTTPS
# with a self-signed TLS certificate, DASH (a real MPD served by http-test itself) and WebDAV — to
# exercise the production code against real servers instead of only in-process
# mocks. None of these services is exposed outside the host: the mapped ports are
# only for local testing through scripts/test-network-protocols.sh.
#
# Usage: see scripts/test-network-protocols.sh (it orchestrates fixture + up + tests + down).

services:
  smb-test:
    image: dperson/samba:latest
    container_name: vrplayer-smb-test
    # Two shares: a guest one (no password, exercises the "anonymous" path of
    # protocols::smb::SmbTarget with an empty username) and an authenticated one
    # (exercises NTLMv2 user/password). See this directory's README.md for the
    # test credentials.
    command: >
      -p
      -u "vruser;vrpass123"
      -s "guestshare;/share/guest;yes;yes;yes"
      -s "authshare;/share/auth;yes;no;no;vruser"
      -n
    volumes:
      - ./fixtures:/share/guest:ro
      - ./fixtures:/share/auth:ro
    ports:
      - "14450:445"
    tmpfs:
      - /tmp

  http-test:
    image: nginx:1.27-alpine
    container_name: vrplayer-http-test
    volumes:
      - ./fixtures:/usr/share/nginx/html:ro
      - ./http-test/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "18080:80"

  https-test:
    build: ./https-test
    container_name: vrplayer-https-test
    volumes:
      - ./fixtures:/usr/share/nginx/html:ro
      - ./https-test/certs:/etc/nginx/tls
    ports:
      - "18443:443"

  ftp-test:
    # `delfer/alpine-ftp-server` (vsftpd on Alpine) instead of other popular
    # options (e.g. `stilliard/pure-ftpd`): a tiny image, configured
    # entirely through env vars (no custom config file needed, unlike what
    # https-test needs for TLS), and `ADDRESS`/`MIN_PORT`/`MAX_PORT`
    # cover exactly what T6.1 requires (passive mode working through
    # Docker's NAT — see "Gotcha: FTP Passive Mode Inside Docker" in this
    # directory's README.md).
    image: delfer/alpine-ftp-server
    container_name: vrplayer-ftp-test
    environment:
      # Format `user|password|home-dir-inside-the-container`. `/ftp/vruser` (instead
      # of the image's default `/home/vruser`) avoids a collision with the real
      # home directory of the `vruser` user that the image's entrypoint
      # creates in `/home` — see the note on the volume below about why the mount
      # cannot be read-only.
      - USERS=vruser|vrpass123|/ftp/vruser
      # PASV_ADDRESS announced to the client in the reply to the PASV command — it has to
      # be an address the CLIENT can reach. Since the test always
      # runs on the same host as Docker (never from another machine), `127.0.0.1`
      # works: the test Rust code connects to `127.0.0.1:12121` and Docker's
      # `docker-proxy` forwards the mapped passive ports
      # (12100-12110) back to the same `127.0.0.1`.
      - ADDRESS=127.0.0.1
      - MIN_PORT=12100
      - MAX_PORT=12110
    volumes:
      # NOT ":ro" (fixes a regression of the `delfer/alpine-ftp-server`
      # image's entrypoint): the entrypoint does `adduser -h
      # /ftp/vruser` + `chown` on the home directory itself during the
      # container boot, which fails with "Read-only file system" if the mount is
      # read-only — even though the directory already "exists" through the bind mount.
      # An ephemeral test container, with no real risk in allowing writes.
      - ./fixtures:/ftp/vruser
    ports:
      - "12121:21"
      - "12100-12110:12100-12110"

  sftp-test:
    # `atmoz/sftp` (a real OpenSSH inside a minimal container) — covers T6.2
    # in both ways the task asks for: a password (`command: vruser:vrpass123:...`)
    # AND a public key (mounted at `.ssh/keys/`, see this directory's `README.md`,
    # section "Gotcha: chroot and the atmoz/sftp Public Key"). The same `vruser` user
    # accepts both methods simultaneously — the OpenSSH server does not require
    # them to be exclusive.
    image: atmoz/sftp:latest
    container_name: vrplayer-sftp-test
    # Format `user:password:uid`. A fixed UID (1001) only to keep it predictable
    # in logs/debug — it has no other meaning.
    command: vruser:vrpass123:1001
    volumes:
      # A subdirectory inside the home, NEVER the home itself (`/home/vruser`) —
      # see README.md, "Gotcha: chroot and the atmoz/sftp Public Key". The
      # image's entrypoint does `chown root:root`/`chmod 755` on the home on
      # every start, so mounting the fixture INSIDE it (not over it)
      # is what keeps the container from refusing authentication with "bad ownership or
      # modes for chroot directory".
      - ./fixtures:/home/vruser/fixtures:ro
      # Documented atmoz/sftp convention: any file in here
      # becomes a line in ~vruser/.ssh/authorized_keys on start (the image's own
      # `create-sftp-user` script, see README.md).
      - ./ssh-keys/vrplayer_test_key.pub:/home/vruser/.ssh/keys/vrplayer_test_key.pub:ro
    ports:
      - "12222:22"

  webdav-test:
    # `bytemark/webdav` (Apache httpd + mod_dav_fs) — covers PROPFIND (multistatus XML),
    # Basic auth and GET with Range against a real WebDAV server. Validated manually
    # with curl before writing the Rust tests (PROPFIND 401 without auth, 207 with
    # auth, GET with Range returning 206) — see this directory's README.md.
    image: bytemark/webdav:latest
    container_name: vrplayer-webdav-test
    environment:
      - AUTH_TYPE=Basic
      - USERNAME=vruser
      - PASSWORD=vrpass123
    volumes:
      # Its own directory (not ./fixtures shared with the other services) — the image's
      # entrypoint touches the permissions of the data directory itself, the same caution as the
      # ftp-test gotcha above.
      - ./fixtures/webdav:/var/lib/dav/data
    ports:
      - "18099:80"

  nfs-test:
    build: ./nfs-test
    container_name: vrplayer-nfs-test
    # Ganesha em espaco de usuario ainda pede algumas capabilities (chown/dac
    # dos arquivos exportados, bind de portas < 1024 para o rpcbind).
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - seccomp:unconfined
    volumes:
      - ./fixtures:/export:ro
    ports:
      - "111:111"
      - "2049:2049"
      - "20048:20048"
