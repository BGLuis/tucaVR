# nginx serve range requests (Accept-Ranges: bytes) nativamente para
# arquivos estaticos — sem config extra necessaria alem de desligar gzip,
# que pode omitir Accept-Ranges/Content-Length dependendo da negociacao.
server {
    listen 80;
    server_name localhost;

    gzip off;
    autoindex off;

    root /usr/share/nginx/html;

    location / {
        add_header Accept-Ranges bytes always;
    }
}
