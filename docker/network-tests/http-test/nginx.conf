# nginx serves range requests (Accept-Ranges: bytes) natively for
# static files — no extra config is needed besides turning gzip off,
# which can omit Accept-Ranges/Content-Length depending on negotiation.
server {
    listen 80;
    server_name localhost;

    gzip off;
    autoindex off;

    root /usr/share/nginx/html;

    location / {
        add_header Accept-Ranges bytes always;
    }
}
