name: tucaVR CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  # No paths-ignore here: a workflow that never starts leaves its required checks
  # "Pending" forever, so docs-only PRs could only merge with an admin bypass.
  # The `changes` job below skips the heavy jobs instead.
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Compilar APK completo'
        type: boolean
        default: true

# Cancels earlier runs on PR branches to save runner resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege at the global scope (supply-chain security and OIDC)
permissions: {}

env:
  JAVA_VERSION: '17'
  JAVA_DISTRO: 'temurin'
  NDK_VERSION: '26.3.11579264'

jobs:
  # Only pull requests are filtered. Pushes and manual runs keep running everything, because
  # release.yml reuses the APK built by the CI run of the pushed commit.
  # Dependabot PRs are skipped automatically to save runner resources (blocked at CI Gate
  # until validated manually via workflow_dispatch on the Dependabot branch).
  changes:
    name: Detect Changes
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read # paths-filter needs the repository metadata
      pull-requests: read # paths-filter lists the PR files through the API
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      cpp: ${{ github.event_name != 'pull_request' || steps.filter.outputs.cpp == 'true' }}
      android: ${{ github.event_name != 'pull_request' || steps.filter.outputs.android == 'true' }}
      apk: ${{ github.event_name != 'pull_request' || steps.filter.outputs.apk == 'true' }}
      docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true' }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - '.github/workflows/main.yml'
              - 'rust/**'
            cpp:
              - '.github/workflows/main.yml'
              - 'native/**'
              - 'scripts/check-shaders.sh'
              - 'scripts/test-native-host.sh'
              - '.clang-format'
            android:
              - '.github/workflows/main.yml'
              - 'app/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'version.properties'
            apk:
              - '.github/workflows/main.yml'
              - 'rust/**'
              - 'native/**'
              - 'app/**'
              - 'gradle/**'
              - 'scripts/**'
              - 'docker/build/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'version.properties'
            docs:
              - '.github/workflows/main.yml'
              - '**/*.md'
              - '.markdownlint-cli2.jsonc'

  security-and-workflows:
    name: Security & Workflows
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # Needed to check sources, workflows and licenses
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans a commit range, which a shallow clone cannot resolve

      - name: Verify version.properties
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: ./scripts/check-version.sh

      - name: Lint GitHub Actions workflows (actionlint)
        run: |
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          # actionlint 1.7.12 predates the 2026 job-level `cache-mode` key
          ./actionlint -color -ignore 'unexpected key "cache-mode" for "job" section'
          rm -f actionlint actionlint.tar.gz

      - name: Check Rust dependencies & licenses (cargo-deny)
        run: |
          curl -sSfL https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz -o cargo-deny.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf cargo-deny.tar.gz
          ./cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny --manifest-path rust/Cargo.toml --config rust/deny.toml check advisories licenses bans sources
          rm -rf cargo-deny-0.20.2-x86_64-unknown-linux-musl cargo-deny.tar.gz

      - name: Scan repository for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

  rust-checks:
    name: Rust Quality & Tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # Needed for building and testing on the host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust (Host)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "rust -> rust/target"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}

      - name: Check Rust formatting (rustfmt)
        run: cd rust && cargo fmt --check

      - name: Lint Rust (clippy --all-targets --all-features)
        run: cd rust && cargo clippy --locked -p protocols -p media-logic --all-targets --all-features -- -D warnings

      - name: Run Rust unit tests (host-testable crates)
        run: cd rust && cargo test --locked -p protocols -p media-logic

  cpp-checks:
    name: C++ Native & Shaders
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # Needed for formatting and shader checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install C++ Host Dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libopenxr-dev glslc
          version: 1.2

      - name: Check C++ Code Formatting (clang-format)
        run: |
          clang-format --dry-run -Werror \
            native/tests/*.cpp \
            native/include/vk_math.h \
            native/include/screen_mode.h \
            native/include/polar_mode.h \
            native/include/subtitle_layout.h \
            native/include/hand_tracking.h \
            native/include/environment_config.h \
            native/include/environment_validator.h \
            native/include/browser_pose.h \
            native/include/panel_pick.h \
            native/include/controls_pose.h \
            native/include/cylinder_hit.h \
            native/include/astc_transcode.h \
            native/include/frame_time_histogram.h \
            native/include/vulkan_msaa.h \
            native/include/screen_layout.h \
            native/include/bed_mode.h \
            native/include/color_grading.h \
            native/include/video_layer.h \
            native/include/ycbcr_format.h

      - name: Validate Vulkan Shaders (glslc)
        run: ./scripts/check-shaders.sh

      - name: Cache ccache (host C++ tests)
        uses: hendrikmuhs/ccache-action@dbeefd73e8e2ffc1bbc412570072735eb4db3607 # v1.2.25
        with:
          key: host-tests-${{ runner.os }}
          max-size: 200M

      - name: Run C++ Host unit tests with AddressSanitizer
        run: ENABLE_ASAN=1 ./scripts/test-native-host.sh

  android-checks:
    name: Android Lint & JVM Tests
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # Needed for static analysis and running the JVM tests
    env:
      # Lint and JVM tests load no native library; without this, preBuild runs buildRust,
      # which builds a Docker image and cross-compiles Rust and FFmpeg (~8 min).
      RUST_BUILD_MODE: skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Lint Kotlin (ktlint)
        run: ./gradlew ktlintCheck

      - name: Android Lint (lintDebug)
        run: ./gradlew :app:lintDebug

      - name: Run Kotlin unit tests (JVM)
        run: ./gradlew testDebugUnitTest

      - name: Upload Test & Lint Reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-verification-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/ktlint/
          retention-days: 7

  markdown-checks:
    name: Markdown Lint
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # Needed to read the Markdown files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown (markdownlint-cli2)
        run: npx --yes markdownlint-cli2@0.18.1

  # The only check branch protection needs. A skipped job reports success, so without this a
  # failed `changes` job would skip every dependent job and let the PR merge unchecked.
  # Dependabot PRs are intentionally blocked here until validated via workflow_dispatch.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [changes, security-and-workflows, rust-checks, cpp-checks, android-checks, markdown-checks]
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Block unvalidated Dependabot PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        run: |
          echo "::error::Automatic CI is disabled for dependabot[bot] PRs to save runner resources."
          echo "Validate manually before merging: gh workflow run main.yml --ref <dependabot-branch>"
          exit 1

      - name: Require every job to have passed or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done

  build-apk:
    name: Build Quest 3 APK
    needs: [changes, security-and-workflows, rust-checks, cpp-checks, android-checks]
    # Runs on push (main/develop) and workflow_dispatch — skipped on pull_request to avoid
    # burning 5-14 min per PR push (release.yml only reuses APKs built on push to main).
    if: >-
      ${{ !cancelled() && !contains(needs.*.result, 'failure')
      && github.event_name != 'pull_request'
      && needs.changes.outputs.apk == 'true'
      && (github.repository == 'BGLuis/vr-multmidia' || github.repository == 'BGLuis/tucaVR')
      && (inputs.build_apk == true || inputs.build_apk == null) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read # Needed to build the APK
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Setup Rust (Android)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "rust -> rust/target"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache ccache (native C++ build)
        uses: hendrikmuhs/ccache-action@dbeefd73e8e2ffc1bbc412570072735eb4db3607 # v1.2.25
        with:
          key: native-build-${{ runner.os }}
          max-size: 500M

      - name: Cache cargo-ndk
        id: cache-cargo-ndk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-bin-v1

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/ndk/26.3.11579264
          key: ${{ runner.os }}-ndk-${{ env.NDK_VERSION }}

      - name: Setup Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"

      - name: Cache FFmpeg Build
        id: cache-ffmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ffmpeg-android-maker
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('scripts/setup-deps.sh') }}-v2

      - name: Cache Meta OpenXR SDK
        id: cache-openxr
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sdk/meta-openxr-sdk
          key: ${{ runner.os }}-meta-openxr-sdk-v1

      - name: Setup External Dependencies (Meta OpenXR SDK)
        if: steps.cache-openxr.outputs.cache-hit != 'true'
        run: ./scripts/setup-deps.sh

      - name: Setup and Compile FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          ./scripts/setup-deps.sh
          cd ffmpeg-android-maker
          export ANDROID_SDK_HOME="$ANDROID_HOME"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./ffmpeg-android-maker.sh --target-abis=arm64-v8a --android-api-level=26

      - name: Build Unified Script (Rust + C++ + Gradle)
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/ffmpeg-android-maker/build/ffmpeg/arm64-v8a/lib/pkgconfig
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: |
          export ANDROID_SDK_HOME="$ANDROID_HOME"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export BINDGEN_EXTRA_CLANG_ARGS="-I$GITHUB_WORKSPACE/ffmpeg-android-maker/output/include/arm64-v8a -I$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include --sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          ./scripts/build.sh

      - name: Sanitize artifact name
        id: artifact-meta
        run: |
          SAFE_REF=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          echo "name=VR-Player-APK-${SAFE_REF}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact-meta.outputs.name }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
