name: tucaVR CI

on:
  push:
    branches: [ master, main, develop ]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [ master, main, develop ]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Compilar APK completo (requer segredo do SDK)'
        type: boolean
        default: true

# Cancela runs anteriores em branches de PR para economizar recursos dos runners
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Privilégio mínimo no escopo global (segurança de supply-chain e OIDC)
permissions: {}

env:
  JAVA_VERSION: '17'
  JAVA_DISTRO: 'temurin'
  NDK_VERSION: '26.3.11579264'

jobs:
  security-and-workflows:
    name: Security & Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # Necessário para checar fontes, workflows e licenças
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows (actionlint)
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: Check Rust dependencies & licenses (cargo-deny)
        run: |
          curl -sL https://github.com/EmbarkStudios/cargo-deny/releases/download/0.18.2/cargo-deny-0.18.2-x86_64-unknown-linux-musl.tar.gz | tar -xz
          ./cargo-deny-0.18.2-x86_64-unknown-linux-musl/cargo-deny --manifest-path rust/Cargo.toml check --config deny.toml licenses bans sources
          rm -rf cargo-deny-0.18.2-x86_64-unknown-linux-musl

      - name: Scan repository for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true
        continue-on-error: true # Notifica no step summary sem abortar caso haja falso positivo em testes

  rust-checks:
    name: Rust Quality & Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # Necessário para compilação e testes no host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust (Host)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> rust/target"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}

      - name: Check Rust formatting (rustfmt)
        run: cd rust && cargo fmt --check

      - name: Lint Rust (clippy --all-targets --all-features)
        run: cd rust && cargo clippy -p protocols -p media-logic --all-targets --all-features -- -D warnings

      - name: Run Rust unit tests (host-testable crates)
        run: cd rust && cargo test -p protocols -p media-logic

  cpp-checks:
    name: C++ Native & Shaders
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # Necessário para checagens de formatação e shaders
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install C++ Host Dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libopenxr-dev glslc
          version: 1.2

      - name: Check C++ Code Formatting (clang-format)
        run: |
          clang-format --dry-run -Werror \
            native/tests/*.cpp \
            native/include/vk_math.h \
            native/include/screen_mode.h \
            native/include/subtitle_layout.h \
            native/include/hand_tracking.h \
            native/include/environment_config.h

      - name: Validate Vulkan Shaders (glslc)
        run: ./scripts/check-shaders.sh

      - name: Cache ccache (host C++ tests)
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: host-tests-${{ runner.os }}
          max-size: 200M

      - name: Run C++ Host unit tests with AddressSanitizer
        run: ENABLE_ASAN=1 ./scripts/test-native-host.sh

  android-checks:
    name: Android Lint & JVM Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # Necessário para análise estática e execução dos testes JVM
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Lint Kotlin (ktlint)
        run: ./gradlew ktlintCheck

      - name: Android Lint (lintDebug)
        run: ./gradlew :app:lintDebug

      - name: Run Kotlin unit tests (JVM)
        run: ./gradlew testDebugUnitTest

      - name: Upload Test & Lint Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/ktlint/
          retention-days: 7

  build-apk:
    name: Build Quest 3 APK
    needs: [security-and-workflows, rust-checks, cpp-checks, android-checks]
    if: (github.repository == 'BGLuis/vr-multmidia' || github.repository == 'BGLuis/tucaVR') && (inputs.build_apk == true || inputs.build_apk == null)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read # Necessário para compilar o APK
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout Meta OpenXR SDK (Private Repo)
        uses: actions/checkout@v4
        with:
          repository: BGLuis/meta-openxr-sdk-private
          token: ${{ secrets.SDK_REPO_PAT }}
          path: sdk/meta-openxr-sdk

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Rust (Android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> rust/target"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache ccache (native C++ build)
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: native-build-${{ runner.os }}
          max-size: 500M

      - name: Cache cargo-ndk
        id: cache-cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-bin-v1

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/26.3.11579264
          key: ${{ runner.os }}-ndk-${{ env.NDK_VERSION }}

      - name: Setup Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${{ env.NDK_VERSION }}"

      - name: Configure Android NDK Environment
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Cache FFmpeg Build
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ffmpeg-android-maker
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('scripts/setup-deps.sh') }}-v2

      - name: Setup and Compile FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          ./scripts/setup-deps.sh
          cd ffmpeg-android-maker
          export ANDROID_SDK_HOME="$ANDROID_HOME"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          ./ffmpeg-android-maker.sh --target-abis=arm64-v8a --android-api-level=26

      - name: Build Unified Script (Rust + C++ + Gradle)
        run: ./scripts/build.sh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_SDK_HOME: ${{ env.ANDROID_SDK_HOME }}
          PKG_CONFIG_PATH: ${{ github.workspace }}/ffmpeg-android-maker/build/ffmpeg/arm64-v8a/lib/pkgconfig
          BINDGEN_EXTRA_CLANG_ARGS: "-I${{ github.workspace }}/ffmpeg-android-maker/output/include/arm64-v8a -I${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include --sysroot=${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VR-Player-APK-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/app-debug.apk
