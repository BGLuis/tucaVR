name: tucaVR CI

on:
  push:
    branches: [ master, main, develop ]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [ master, main, develop ]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy, rustfmt
          
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
        
      - name: Lint Rust (clippy)
        run: cd rust && cargo clippy -p protocols -p media-logic -- -D warnings

      # `core`, `audio` e `bridge` dependem de ndk/ndk-sys/oboe (Android-only) e nao
      # rodam (nem compilam de forma confiavel) num host generico com `cargo test` —
      # ver docs/TESTING-PLAN.md, secao "O que roda no host vs. so no Android". A logica
      # pura que antes vivia dentro de `core` (SyncManager, matematica de resample de
      # audio, clamps de velocidade/volume, contrato de "geracao" de playback) foi
      # extraida para a crate `media-logic`, que tem zero dependencias Android e roda
      # aqui normalmente. `protocols` (SMB URI/redact, prefetch, HTTP probe/range) ja
      # era host-testable.
      - name: Run Rust unit tests (host-testable crates)
        run: cd rust && cargo test -p protocols -p media-logic

      - name: Run C++ Host unit tests
        run: |
          sudo apt-get update -y && sudo apt-get install -y libopenxr-dev
          ./scripts/test-native-host.sh

      - name: Lint Kotlin (ktlint)
        run: ./gradlew ktlintCheck || echo "ktlint not configured yet"

      # Testes JVM puros do Kotlin (app/src/test) — file browser (MediaSorter,
      # DirectoryNavigator, DirectoryLister, cache-key do ThumbnailGenerator). Rodam
      # sem emulador/dispositivo, ver docs/TESTING-PLAN.md.
      - name: Run Kotlin unit tests (JVM)
        run: ./gradlew testDebugUnitTest

      # O build C++/Android completo no CI requer download do Meta OpenXR SDK e NDK configurado.
      # Habilitar conforme a infraestrutura for configurada com os SDKs.
      # - name: Build Unified Script
      #   run: ./scripts/build.sh

  build-apk:
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Checkout Meta OpenXR SDK (Private Repo)
        uses: actions/checkout@v5
        with:
          repository: BGLuis/meta-openxr-sdk-private
          token: ${{ secrets.SDK_REPO_PAT }}
          path: sdk/meta-openxr-sdk

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
        
      - name: Setup Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "ANDROID_SDK_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Clone ffmpeg-android-maker
        run: ./scripts/setup-deps.sh
        
      - name: Cache FFmpeg Build
        id: cache-ffmpeg
        uses: actions/cache@v5
        with:
          path: ffmpeg-android-maker
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('scripts/setup-deps.sh') }}-v1
          
      - name: Compile FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          cd ffmpeg-android-maker
          export ANDROID_SDK_HOME=$ANDROID_HOME
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264
          ./ffmpeg-android-maker.sh --target-abis=arm64-v8a --android-api-level=26

      - name: Build Unified Script (Rust + C++ + Gradle)
        run: ./scripts/build.sh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_SDK_HOME: ${{ env.ANDROID_SDK_HOME }}
          PKG_CONFIG_PATH: ${{ github.workspace }}/ffmpeg-android-maker/build/ffmpeg/arm64-v8a/lib/pkgconfig
          BINDGEN_EXTRA_CLANG_ARGS: "-I${{ github.workspace }}/ffmpeg-android-maker/output/include/arm64-v8a -I${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include --sysroot=${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: VR-Player-APK-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/app-debug.apk
