name: tucaVR Release (Auto & Manual)

on:
  # Triggers after the CI (tucaVR CI / main.yml) finishes successfully on main — the
  # pre-release so nasce apos a validacao, e reaproveitamos o APK que o CI ja compilou
  # instead of rebuilding from scratch (see the build-and-release job below).
  workflow_run:
    workflows: [ "tucaVR CI" ]
    types: [ completed ]
    branches: [ main ]
  push:
    tags:
      - 'v*' # Also triggers when a tag starts with 'v' (e.g. v1.0.0, v1.0.0-beta)
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nome da Tag (ex: v1.0.0)'
        required: false
        type: string
      prerelease:
        description: 'Mark as a pre-release'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Releases must not be aborted if new commits come in

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  JAVA_DISTRO: 'temurin'
  NDK_VERSION: '26.3.11579264'

jobs:
  # Looks for a successful tucaVR CI (main.yml) run, for the commit being released,
  # that has already built the same APK — avoids rebuilding from scratch on every push to main.
  locate-artifact:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Find matching tucaVR CI run for this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${SHA}&status=success&per_page=20" \
            --jq '[.workflow_runs[] | select(.name=="tucaVR CI")] | sort_by(.created_at) | reverse | .[0].id // empty')
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "Commit ${SHA}: run_id do tucaVR CI encontrado = '${RUN_ID:-<nenhum>}'"

  build-and-release:
    needs: locate-artifact
    if: always() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write # Strictly needed only to create the release
      actions: read # Needed to download an artifact from another run (reusing the CI's APK)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Fast path: the tucaVR CI already built this exact commit — reuse its APK
      # instead of redoing the whole Rust+FFmpeg+C+++Gradle build. If it fails (artifact
      # expired, run not found, etc.), the full-build steps below take over.
      - name: Try reusing APK already built by tucaVR CI
        id: reuse
        if: needs.locate-artifact.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: VR-Player-APK-*
          merge-multiple: true
          run-id: ${{ needs.locate-artifact.outputs.run_id }}
          github-token: ${{ github.token }}
          path: app/build/outputs/apk/debug/

      # ---- From here on, all the build steps only run if the reuse above did not work out ----

      - name: Setup External Dependencies (Meta OpenXR SDK)
        if: steps.reuse.outcome != 'success'
        run: ./scripts/setup-deps.sh

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        if: steps.reuse.outcome != 'success'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}

      - name: Setup Gradle
        if: steps.reuse.outcome != 'success'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Setup Rust (Android)
        if: steps.reuse.outcome != 'success'
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Rust Cache
        if: steps.reuse.outcome != 'success'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "rust -> rust/target"

      - name: Setup sccache
        if: steps.reuse.outcome != 'success'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache ccache (native C++ build)
        if: steps.reuse.outcome != 'success'
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: native-build-${{ runner.os }}
          max-size: 500M

      - name: Cache cargo-ndk
        if: steps.reuse.outcome != 'success'
        id: cache-cargo-ndk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-bin-v1

      - name: Install cargo-ndk
        if: steps.reuse.outcome != 'success' && steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked

      - name: Cache Android NDK
        if: steps.reuse.outcome != 'success'
        id: cache-ndk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/ndk/26.3.11579264
          key: ${{ runner.os }}-ndk-${{ env.NDK_VERSION }}

      - name: Setup Android NDK
        if: steps.reuse.outcome != 'success' && steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${{ env.NDK_VERSION }}"

      - name: Configure Android NDK Environment
        if: steps.reuse.outcome != 'success'
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Cache FFmpeg Build
        if: steps.reuse.outcome != 'success'
        id: cache-ffmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ffmpeg-android-maker
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('scripts/setup-deps.sh') }}-v2

      - name: Setup and Compile FFmpeg
        if: steps.reuse.outcome != 'success' && steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          ./scripts/setup-deps.sh
          cd ffmpeg-android-maker
          export ANDROID_SDK_HOME="$ANDROID_HOME"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          ./ffmpeg-android-maker.sh --target-abis=arm64-v8a --android-api-level=26

      - name: Determine Release Configuration
        id: config
        env:
          REF_TYPE: ${{ github.event_name == 'workflow_run' && 'branch' || github.ref_type }}
          REF_NAME: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          REF: ${{ github.event.workflow_run.head_branch && format('refs/heads/{0}', github.event.workflow_run.head_branch) || github.ref }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number || github.run_number }}
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # Load the official system version from version.properties
          SYS_VERSION=$(grep -E '^versionName=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          if [[ -z "$SYS_VERSION" ]]; then
            SYS_VERSION="0.4.7"
          fi
          SYS_CODE=$(grep -E '^versionCode=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          if [[ -z "$SYS_CODE" ]]; then
            SYS_CODE="470"
          fi

          if [[ -n "$INPUT_TAG" ]]; then
            CLEAN_VERSION="${INPUT_TAG#v}"
            {
              echo "rel_name=Release $INPUT_TAG"
              echo "rel_tag=$INPUT_TAG"
              echo "is_prerelease=$INPUT_PRERELEASE"
              echo "APP_VERSION_NAME=$CLEAN_VERSION"
              echo "APP_VERSION_CODE=$SYS_CODE"
            } >> "$GITHUB_ENV"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            CLEAN_VERSION="${REF_NAME#v}"
            IS_PRE="false"
            if [[ "$REF" == *"-beta"* ]] || [[ "$REF" == *"-alpha"* ]]; then
              IS_PRE="true"
            fi
            {
              echo "rel_name=Release $REF_NAME"
              echo "rel_tag=$REF_NAME"
              echo "is_prerelease=$IS_PRE"
              echo "APP_VERSION_NAME=$CLEAN_VERSION"
              echo "APP_VERSION_CODE=$SYS_CODE"
            } >> "$GITHUB_ENV"
          else
            # Push to the main branch: uses the system version with the build number
            {
              echo "rel_name=Release v${SYS_VERSION} (Build #${RUN_NUMBER})"
              echo "rel_tag=v${SYS_VERSION}-build.${RUN_NUMBER}"
              echo "is_prerelease=true"
              echo "APP_VERSION_NAME=${SYS_VERSION}-build.${RUN_NUMBER}"
              echo "APP_VERSION_CODE=$SYS_CODE"
            } >> "$GITHUB_ENV"
          fi

      - name: Build Unified Script (Rust + C++ + Gradle)
        if: steps.reuse.outcome != 'success'
        run: ./scripts/build.sh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_SDK_HOME: ${{ env.ANDROID_SDK_HOME }}
          PKG_CONFIG_PATH: ${{ github.workspace }}/ffmpeg-android-maker/build/ffmpeg/arm64-v8a/lib/pkgconfig
          BINDGEN_EXTRA_CLANG_ARGS: "-I${{ github.workspace }}/ffmpeg-android-maker/output/include/arm64-v8a -I${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include --sysroot=${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"

      - name: Prepare Release Artifacts
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "tucaVR-${{ env.rel_tag }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            tucaVR-${{ env.rel_tag }}.apk
            app/build/outputs/apk/debug/app-debug.apk
          name: ${{ env.rel_name }}
          tag_name: ${{ env.rel_tag }}
          generate_release_notes: true
          prerelease: ${{ env.is_prerelease == 'true' }}
          draft: false
