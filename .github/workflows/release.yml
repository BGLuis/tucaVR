name: VR Player Release (Auto & Manual)

on:
  push:
    branches:
      - develop
    tags:
      - 'v*' # Dispara também quando uma tag começar com 'v' (ex: v1.0.0, v1.0.0-beta)

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessário para criar a release
    
    steps:
      - uses: actions/checkout@v5

      - name: Checkout Meta OpenXR SDK (Private Repo)
        uses: actions/checkout@v5
        with:
          repository: BGLuis/meta-openxr-sdk-private
          token: ${{ secrets.SDK_REPO_PAT }}
          path: sdk/meta-openxr-sdk

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
        
      - name: Setup Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "ANDROID_SDK_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Clone ffmpeg-android-maker
        run: ./scripts/setup-deps.sh
        
      - name: Cache FFmpeg Build
        id: cache-ffmpeg
        uses: actions/cache@v5
        with:
          path: ffmpeg-android-maker
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('scripts/setup-deps.sh') }}-v1
          
      - name: Compile FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          cd ffmpeg-android-maker
          export ANDROID_SDK_HOME=$ANDROID_HOME
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264
          ./ffmpeg-android-maker.sh --target-abis=arm64-v8a --android-api-level=26

      - name: Build Unified Script (Rust + C++ + Gradle)
        run: ./scripts/build.sh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_SDK_HOME: ${{ env.ANDROID_SDK_HOME }}
          PKG_CONFIG_PATH: ${{ github.workspace }}/ffmpeg-android-maker/build/ffmpeg/arm64-v8a/lib/pkgconfig
          BINDGEN_EXTRA_CLANG_ARGS: "-I${{ github.workspace }}/ffmpeg-android-maker/output/include/arm64-v8a -I${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include --sysroot=${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

      - name: Determine Release Configuration
        id: config
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "rel_name=Release ${{ github.ref_name }}" >> $GITHUB_ENV
            echo "rel_tag=${{ github.ref_name }}" >> $GITHUB_ENV
            if [[ "${{ github.ref }}" == *"-beta"* ]] || [[ "${{ github.ref }}" == *"-alpha"* ]]; then
              echo "is_prerelease=true" >> $GITHUB_ENV
            else
              echo "is_prerelease=false" >> $GITHUB_ENV
            fi
          else
            echo "rel_name=Auto-Build #${{ github.run_number }}" >> $GITHUB_ENV
            echo "rel_tag=build-${{ github.run_number }}" >> $GITHUB_ENV
            echo "is_prerelease=true" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: ${{ env.rel_name }}
          tag_name: ${{ env.rel_tag }}
          generate_release_notes: true
          prerelease: ${{ env.is_prerelease == 'true' }}
          draft: false
