name: tucaVR Release (Auto & Manual)

on:
  # Triggers after the CI (tucaVR CI / main.yml) finishes successfully on main — the
  # pre-release is only created after validation, and we reuse the APK already built by CI
  # instead of rebuilding from scratch (see the build-and-release job below).
  # zizmor: ignore[dangerous-triggers] - guarded on every job to only accept push events on main from this repository
  workflow_run:
    workflows: [ "tucaVR CI" ]
    types: [ completed ]
    branches: [ main ]
  push:
    tags:
      - 'v*' # Also triggers when a tag starts with 'v' (e.g. v1.0.0, v1.0.0-beta)
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nome da Tag (ex: v1.0.0)'
        required: false
        type: string
      prerelease:
        description: 'Mark as a pre-release'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Releases must not be aborted if new commits come in

permissions: {}

env:
  JAVA_VERSION: '17'
  JAVA_DISTRO: 'temurin'
  NDK_VERSION: '26.3.11579264'

jobs:
  # Looks for a successful tucaVR CI (main.yml) run, for the commit being released,
  # that has already built the same APK — avoids rebuilding from scratch on every push to main.
  locate-artifact:
    name: Locate CI Artifact
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: read # List workflow runs to locate the prebuilt APK artifact
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Find matching tucaVR CI run for this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          RUN_ID=$(gh api "repos/${GH_REPO}/actions/runs?head_sha=${SHA}&status=success&per_page=20" \
            --jq '[.workflow_runs[] | select(.name=="tucaVR CI")] | sort_by(.created_at) | reverse | .[0].id // empty')
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "Commit ${SHA}: tucaVR CI run_id = '${RUN_ID:-<none>}'"

  build-and-release:
    name: Build & Publish Release
    needs: locate-artifact
    if: >-
      !cancelled()
      && (github.event_name != 'workflow_run'
          || (github.event.workflow_run.conclusion == 'success'
              && github.event.workflow_run.event == 'push'
              && github.event.workflow_run.head_branch == 'main'
              && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    cache-mode: none # Release/publish job: never restore or save caches
    permissions:
      contents: write # Create the GitHub Release and upload assets
      actions: read # Download the prebuilt APK artifact from the matching CI run

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # Fast path: the tucaVR CI already built this exact commit — reuse its APK
      # instead of redoing the whole Rust+FFmpeg+C+++Gradle build. If it fails (artifact
      # expired, run not found, etc.), the full-build steps below take over.
      - name: Try reusing APK already built by tucaVR CI
        id: reuse
        if: needs.locate-artifact.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: VR-Player-APK-*
          merge-multiple: true
          run-id: ${{ needs.locate-artifact.outputs.run_id }}
          github-token: ${{ github.token }}
          path: app/build/outputs/apk/debug/

      # ---- From here on, all the build steps only run if the reuse above did not work out ----

      - name: Setup External Dependencies (Meta OpenXR SDK)
        if: steps.reuse.outcome != 'success'
        run: ./scripts/setup-deps.sh

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        if: steps.reuse.outcome != 'success'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}

      - name: Setup Gradle
        if: steps.reuse.outcome != 'success'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Setup Rust (Android)
        if: steps.reuse.outcome != 'success'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        if: steps.reuse.outcome != 'success'
        run: cargo install cargo-ndk --locked

      - name: Setup Android NDK
        if: steps.reuse.outcome != 'success'
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"

      - name: Setup and Compile FFmpeg
        if: steps.reuse.outcome != 'success'
        run: |
          cd ffmpeg-android-maker
          export ANDROID_SDK_HOME="$ANDROID_HOME"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./ffmpeg-android-maker.sh --target-abis=arm64-v8a --android-api-level=26

      - name: Determine Release Configuration
        id: config
        env:
          REF_TYPE: ${{ github.event_name == 'workflow_run' && 'branch' || github.ref_type }}
          REF_NAME: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          REF: ${{ github.event.workflow_run.head_branch && format('refs/heads/{0}', github.event.workflow_run.head_branch) || github.ref }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number || github.run_number }}
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # Load the official system version from version.properties
          SYS_VERSION=$(grep -E '^versionName=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          if [[ -z "$SYS_VERSION" ]]; then
            SYS_VERSION="0.4.7"
          fi
          SYS_CODE=$(grep -E '^versionCode=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          if [[ -z "$SYS_CODE" ]]; then
            SYS_CODE="470"
          fi

          if [[ -n "$INPUT_TAG" ]]; then
            CLEAN_VERSION="${INPUT_TAG#v}"
            {
              echo "rel_name=Release $INPUT_TAG"
              echo "rel_tag=$INPUT_TAG"
              echo "is_prerelease=$INPUT_PRERELEASE"
              echo "app_version_name=$CLEAN_VERSION"
              echo "app_version_code=$SYS_CODE"
              echo "ref_type=$REF_TYPE"
            } >> "$GITHUB_OUTPUT"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            CLEAN_VERSION="${REF_NAME#v}"
            IS_PRE="false"
            if [[ "$REF" == *"-beta"* ]] || [[ "$REF" == *"-alpha"* ]]; then
              IS_PRE="true"
            fi
            {
              echo "rel_name=Release $REF_NAME"
              echo "rel_tag=$REF_NAME"
              echo "is_prerelease=$IS_PRE"
              echo "app_version_name=$CLEAN_VERSION"
              echo "app_version_code=$SYS_CODE"
              echo "ref_type=$REF_TYPE"
            } >> "$GITHUB_OUTPUT"
          else
            # Push to the main branch: uses the system version with the build number
            {
              echo "rel_name=Release v${SYS_VERSION} (Build #${RUN_NUMBER})"
              echo "rel_tag=v${SYS_VERSION}-build.${RUN_NUMBER}"
              echo "is_prerelease=true"
              echo "app_version_name=${SYS_VERSION}-build.${RUN_NUMBER}"
              echo "app_version_code=$SYS_CODE"
              echo "ref_type=$REF_TYPE"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build Unified Script (Rust + C++ + Gradle)
        if: steps.reuse.outcome != 'success'
        env:
          APP_VERSION_NAME: ${{ steps.config.outputs.app_version_name }}
          APP_VERSION_CODE: ${{ steps.config.outputs.app_version_code }}
        run: |
          export ANDROID_SDK_HOME="$ANDROID_HOME"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/ffmpeg-android-maker/build/ffmpeg/arm64-v8a/lib/pkgconfig"
          export BINDGEN_EXTRA_CLANG_ARGS="-I$GITHUB_WORKSPACE/ffmpeg-android-maker/output/include/arm64-v8a -I$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include --sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          ./scripts/build.sh

      - name: Prepare Release Artifacts
        env:
          REL_TAG: ${{ steps.config.outputs.rel_tag }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "tucaVR-${REL_TAG}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REL_TAG: ${{ steps.config.outputs.rel_tag }}
          REL_NAME: ${{ steps.config.outputs.rel_name }}
          IS_PRERELEASE: ${{ steps.config.outputs.is_prerelease }}
          REF_TYPE: ${{ steps.config.outputs.ref_type }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          args=(
            "$REL_TAG"
            "tucaVR-${REL_TAG}.apk"
            "app/build/outputs/apk/debug/app-debug.apk"
            --title "$REL_NAME"
            --generate-notes
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          if [[ "$REF_TYPE" == "tag" ]]; then
            args+=(--verify-tag)
          else
            args+=(--target "$TARGET_SHA")
          fi
          gh release create "${args[@]}"
