name: tucaVR Release (Auto & Manual)

on:
  # Dispara depois que o CI (tucaVR CI / main.yml) terminar com sucesso em main — a
  # pre-release so nasce apos a validacao, e reaproveitamos o APK que o CI ja compilou
  # em vez de recompilar do zero (ver job build-and-release abaixo).
  workflow_run:
    workflows: [ "tucaVR CI" ]
    types: [ completed ]
    branches: [ main ]
  push:
    tags:
      - 'v*' # Dispara também quando uma tag começar com 'v' (ex: v1.0.0, v1.0.0-beta)
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nome da Tag (ex: v1.0.0)'
        required: false
        type: string
      prerelease:
        description: 'Marcar como pré-release'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Releases não devem ser abortadas se novos commits entrarem

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  JAVA_DISTRO: 'temurin'
  NDK_VERSION: '26.3.11579264'

jobs:
  # Procura, para o commit sendo lançado, uma run bem-sucedida do tucaVR CI (main.yml)
  # que já tenha compilado o mesmo APK — evita recompilar do zero em todo push em main.
  locate-artifact:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Find matching tucaVR CI run for this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${SHA}&status=success&per_page=20" \
            --jq '[.workflow_runs[] | select(.name=="tucaVR CI")] | sort_by(.created_at) | reverse | .[0].id // empty')
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "Commit ${SHA}: run_id do tucaVR CI encontrado = '${RUN_ID:-<nenhum>}'"

  build-and-release:
    needs: locate-artifact
    if: always() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write # Estritamente necessário apenas para criar o release
      actions: read # Necessário para baixar artefato de outra run (reuso do APK do CI)

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Caminho rápido: o tucaVR CI já compilou este commit exato — reaproveita o APK
      # em vez de refazer todo o build Rust+FFmpeg+C+++Gradle. Se falhar (artefato
      # expirado, run não encontrada etc.), os steps de build completo abaixo assumem.
      - name: Try reusing APK already built by tucaVR CI
        id: reuse
        if: needs.locate-artifact.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: VR-Player-APK-main
          run-id: ${{ needs.locate-artifact.outputs.run_id }}
          github-token: ${{ github.token }}
          path: app/build/outputs/apk/debug/

      # ---- A partir daqui, todos os steps de build só rodam se o reuso acima não deu certo ----

      - name: Checkout Meta OpenXR SDK (Private Repo)
        if: steps.reuse.outcome != 'success'
        uses: actions/checkout@v4
        with:
          repository: BGLuis/meta-openxr-sdk-private
          token: ${{ secrets.SDK_REPO_PAT }}
          path: sdk/meta-openxr-sdk

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        if: steps.reuse.outcome != 'success'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}

      - name: Setup Gradle
        if: steps.reuse.outcome != 'success'
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Rust (Android)
        if: steps.reuse.outcome != 'success'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        if: steps.reuse.outcome != 'success'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> rust/target"

      - name: Setup sccache
        if: steps.reuse.outcome != 'success'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache ccache (native C++ build)
        if: steps.reuse.outcome != 'success'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: native-build-${{ runner.os }}
          max-size: 500M

      - name: Cache cargo-ndk
        if: steps.reuse.outcome != 'success'
        id: cache-cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-bin-v1

      - name: Install cargo-ndk
        if: steps.reuse.outcome != 'success' && steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked

      - name: Cache Android NDK
        if: steps.reuse.outcome != 'success'
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/26.3.11579264
          key: ${{ runner.os }}-ndk-${{ env.NDK_VERSION }}

      - name: Setup Android NDK
        if: steps.reuse.outcome != 'success' && steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;${{ env.NDK_VERSION }}"

      - name: Configure Android NDK Environment
        if: steps.reuse.outcome != 'success'
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV
          echo "ANDROID_SDK_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Cache FFmpeg Build
        if: steps.reuse.outcome != 'success'
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ffmpeg-android-maker
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('scripts/setup-deps.sh') }}-v2

      - name: Setup and Compile FFmpeg
        if: steps.reuse.outcome != 'success' && steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          ./scripts/setup-deps.sh
          cd ffmpeg-android-maker
          export ANDROID_SDK_HOME=$ANDROID_HOME
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}
          ./ffmpeg-android-maker.sh --target-abis=arm64-v8a --android-api-level=26

      - name: Determine Release Configuration
        id: config
        env:
          REF_TYPE: ${{ github.event_name == 'workflow_run' && 'branch' || github.ref_type }}
          REF_NAME: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          REF: ${{ github.event.workflow_run.head_branch && format('refs/heads/{0}', github.event.workflow_run.head_branch) || github.ref }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number || github.run_number }}
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # Carregar versão oficial do sistema a partir de version.properties
          SYS_VERSION=$(grep -E '^versionName=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          if [[ -z "$SYS_VERSION" ]]; then
            SYS_VERSION="0.4.7"
          fi
          SYS_CODE=$(grep -E '^versionCode=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          if [[ -z "$SYS_CODE" ]]; then
            SYS_CODE="470"
          fi

          if [[ -n "$INPUT_TAG" ]]; then
            CLEAN_VERSION="${INPUT_TAG#v}"
            echo "rel_name=Release $INPUT_TAG" >> "$GITHUB_ENV"
            echo "rel_tag=$INPUT_TAG" >> "$GITHUB_ENV"
            echo "is_prerelease=$INPUT_PRERELEASE" >> "$GITHUB_ENV"
            echo "APP_VERSION_NAME=$CLEAN_VERSION" >> "$GITHUB_ENV"
            echo "APP_VERSION_CODE=$SYS_CODE" >> "$GITHUB_ENV"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            CLEAN_VERSION="${REF_NAME#v}"
            echo "rel_name=Release $REF_NAME" >> "$GITHUB_ENV"
            echo "rel_tag=$REF_NAME" >> "$GITHUB_ENV"
            if [[ "$REF" == *"-beta"* ]] || [[ "$REF" == *"-alpha"* ]]; then
              echo "is_prerelease=true" >> "$GITHUB_ENV"
            else
              echo "is_prerelease=false" >> "$GITHUB_ENV"
            fi
            echo "APP_VERSION_NAME=$CLEAN_VERSION" >> "$GITHUB_ENV"
            echo "APP_VERSION_CODE=$SYS_CODE" >> "$GITHUB_ENV"
          else
            # Push na branch main: utiliza a versão do sistema com número da build
            echo "rel_name=Release v${SYS_VERSION} (Build #${RUN_NUMBER})" >> "$GITHUB_ENV"
            echo "rel_tag=v${SYS_VERSION}-build.${RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "is_prerelease=true" >> "$GITHUB_ENV"
            echo "APP_VERSION_NAME=${SYS_VERSION}-build.${RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "APP_VERSION_CODE=$SYS_CODE" >> "$GITHUB_ENV"
          fi

      - name: Build Unified Script (Rust + C++ + Gradle)
        if: steps.reuse.outcome != 'success'
        run: ./scripts/build.sh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_SDK_HOME: ${{ env.ANDROID_SDK_HOME }}
          PKG_CONFIG_PATH: ${{ github.workspace }}/ffmpeg-android-maker/build/ffmpeg/arm64-v8a/lib/pkgconfig
          BINDGEN_EXTRA_CLANG_ARGS: "-I${{ github.workspace }}/ffmpeg-android-maker/output/include/arm64-v8a -I${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include --sysroot=${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"

      - name: Prepare Release Artifacts
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "tucaVR-${{ env.rel_tag }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tucaVR-${{ env.rel_tag }}.apk
            app/build/outputs/apk/debug/app-debug.apk
          name: ${{ env.rel_name }}
          tag_name: ${{ env.rel_tag }}
          generate_release_notes: true
          prerelease: ${{ env.is_prerelease == 'true' }}
          draft: false
