name: ✨ Feature Request
description: Suggest a new idea or feature for the VR player
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for contributing ideas to the project!
  - type: textarea
    id: problem
    attributes:
      label: The Problem or Limitation
      description: Is your feature request related to a current problem? E.g. "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe in detail how you would like the feature to work, considering VR interactions (controllers, immersion, 3D menus).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other solutions you've considered (e.g. how other VR players solve this).
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add links, design references, mockups, or inspiration images here.
