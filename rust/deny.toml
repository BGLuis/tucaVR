# cargo-deny configuration for supply-chain validation in tucaVR
# https://embarkstudios.github.io/cargo-deny/

[advisories]
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa timing side channel (Marvin); pulled in by russh/ssh-key and no fixed release exists" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.37 DoS; the fix needs 0.41, which moves entity handling to Event::GeneralRef and requires reworking the DASH/DLNA/WebDAV parsers (tracked as follow-up)" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.37 DoS; same upgrade as RUSTSEC-2026-0194" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "BSL-1.0",
    "WTFPL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "audio"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "bridge"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "core"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "media-logic"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "protocols"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
