# Configuração do cargo-deny para validação de supply chain no tucaVR
# https://embarkstudios.github.io/cargo-deny/

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "BSL-1.0",
    "WTFPL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "audio"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "bridge"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "core"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "media-logic"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "protocols"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
