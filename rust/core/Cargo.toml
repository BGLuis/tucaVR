[package]
name = "core"
version = "0.1.0"
edition = "2021"

[dependencies]
ffmpeg-next = "9.0"
# api-level-28: precisa de OutputBuffer::format()/MediaCodec::output_format()
# (thumbnail.rs, decode de hardware da trilha de scrub) — as funcoes C
# subjacentes (AMediaCodec_getOutputFormat/getBufferFormat) existem desde a
# API 21 no NDK, o gate da crate ndk e so um agrupamento de superficie Rust,
# nao um requisito real de plataforma mais nova que o -P 26 ja usado no build.
ndk = { version = "0.9", features = ["media", "api-level-26", "api-level-28", "nativewindow"] }
ndk-sys = "0.6"
crossbeam-channel = "0.5"
tokio = { version = "1.0", features = ["full"] }
audio = { path = "../audio" }
# T6.3/T7.2: Demuxer::new despacha smb://, https:// (custom I/O) e local/http://
# (nativo do libavformat) para esta crate — ver demuxer.rs.
protocols = { path = "../protocols" }
# Logica pura (sem deps Android) extraida para ser testavel via `cargo test`
# no host — ver rust/media-logic/src/lib.rs. sync.rs e parte de
# audio_decoder.rs delegam para ca em vez de reimplementar a mesma logica.
media-logic = { path = "../media-logic" }
