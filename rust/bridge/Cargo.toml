[package]
name = "bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
core = { path = "../core" }
protocols = { path = "../protocols" }
audio = { path = "../audio" }
media-logic = { path = "../media-logic" }
once_cell = "1.19"
ndk-sys = "0.6.0"
# So pra poder implementar log::Log (ver AndroidLogger em lib.rs) — ja estava
# no Cargo.lock transitivamente (via protocols), nao adiciona dependencia nova.
log = "0.4"
